<!-- OpenScience Shared Header - Injected into MyST book-theme -->
<header style="
  position: sticky;
  top: 0;
  z-index: 50;
  background-color: #013243;
  border-bottom: 1px solid #1a5063;
  height: 3.5rem;
  display: flex;
  align-items: center;
">
  <div style="
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  ">
    <a href="/" style="
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: -0.025em;
    ">Open Science</a>

    <nav style="display: flex; align-items: center; gap: 0.25rem;">
      <a href="/" style="
        color: rgba(255,255,255,0.8);
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.375rem 0.75rem;
        border-radius: 0.375rem;
        transition: background-color 0.15s;
      " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.1)'; this.style.color='#ffffff'"
         onmouseout="this.style.backgroundColor='transparent'; this.style.color='rgba(255,255,255,0.8)'">Home</a>
      <a href="/guide/intro" style="
        color: #ffffff;
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.375rem 0.75rem;
        border-radius: 0.375rem;
        background-color: rgba(255,255,255,0.1);
      ">Guide</a>
      <a href="/about" style="
        color: rgba(255,255,255,0.8);
        text-decoration: none;
        font-size: 0.875rem;
        padding: 0.375rem 0.75rem;
        border-radius: 0.375rem;
        transition: background-color 0.15s;
      " onmouseover="this.style.backgroundColor='rgba(255,255,255,0.1)'; this.style.color='#ffffff'"
         onmouseout="this.style.backgroundColor='transparent'; this.style.color='rgba(255,255,255,0.8)'">About</a>
    </nav>
  </div>
</header>
